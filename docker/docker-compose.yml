# Run from the repository root:
#   docker compose -f docker/docker-compose.yml --env-file .env up -d --build
# All build contexts are the repository root; each Dockerfile has its own allowlist .dockerignore.
name: smart_surveillance

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: surveillance
      POSTGRES_USER: surveillance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveillance"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      VISION_SERVICE_URL: http://vision:8001
      DJANGO_ALLOWED_HOSTS: backend,${DJANGO_ALLOWED_HOSTS:-localhost}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  vision:
    build:
      context: ..
      dockerfile: docker/vision.Dockerfile
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu130}
    environment:
      BACKEND_URL: http://backend:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      TARGET_FPS: ${TARGET_FPS:-15}
    depends_on: [backend]
    restart: unless-stopped
    # NVIDIA GPU. CPU-only host: delete this block and set TORCH_INDEX=https://download.pytorch.org/whl/cpu
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on: [backend, vision]
    restart: unless-stopped

volumes:
  pgdata:
