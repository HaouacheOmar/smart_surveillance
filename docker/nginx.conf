server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Machine-to-machine endpoints are reachable only on the internal Docker network.
    location /api/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public LCD push feed.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # MJPEG streams: only for logged-in users (Django validates the access cookie).
    location /stream/ {
        auth_request /_auth;
        proxy_pass http://vision:8001/streams/;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /_auth {
        internal;
        proxy_pass http://backend:8000/api/auth/me/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
